name: x86-seccomp-abi
on:
  push:
    branches: [main]
jobs:
  abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc libseccomp-dev python3
      - name: characterize x86_64 ia32 and x32
        run: bash run_abi.sh
